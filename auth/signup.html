<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - Oxford Comma</title>
  <style>
    :root {
      --navy: #1B2540;
      --cream: #FFF6E6;
      --white: #FFFFFF;
      --butter: #FFD66B;
      --matcha: #A8CC8C;
      --soft: #5A6078;
      --ok: #2F6B45;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--navy);
      color: var(--cream);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap');

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-area img {
      width: 60px;
      height: 60px;
      margin-bottom: 16px;
    }

    .logo-area h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      text-transform: lowercase;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--butter);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--cream);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: var(--navy);
      background: var(--cream);
    }

    .form-input::placeholder {
      color: var(--soft);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--butter);
      color: var(--navy);
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      text-transform: lowercase;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .submit-btn:hover {
      transform: scale(1.02);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-link {
      text-align: center;
      padding: 12px;
      background: rgba(255, 246, 230, 0.05);
      border-radius: 8px;
      border: 2px solid rgba(255, 246, 230, 0.1);
    }

    .login-link a {
      color: var(--butter);
      text-decoration: none;
      font-weight: 700;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .error-msg {
      color: #FF6B35;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .info-msg {
      background: rgba(168, 204, 140, 0.1);
      color: var(--matcha);
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 20px;
      border-left: 4px solid var(--matcha);
    }

    .verification-form {
      display: none;
    }

    .verification-form.active {
      display: block;
    }

    .code-input {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .back-link {
      text-align: center;
      margin-top: 16px;
    }

    .back-link a {
      color: var(--soft);
      text-decoration: none;
      font-size: 12px;
    }

    .back-link a:hover {
      color: var(--cream);
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }

    .checkbox-group input {
      margin-top: 4px;
    }

    .checkbox-label {
      font-size: 12px;
      color: var(--soft);
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo-area" onclick="window.location.href='../app.html'" style="cursor: pointer;">
    <img src="../logo.svg" alt="Oxford Comma" style="cursor: pointer;">
    <h1 style="cursor: pointer;">Oxford Comma</h1>
  </div>

  <div id="signupForm">
    <div class="info-msg">
      Email is required. Phone is optional.
    </div>

    <div class="form-group">
      <label class="form-label">Full name</label>
      <input type="text" class="form-input" id="nameInput" placeholder="Your name">
      <div class="error-msg" id="nameError"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="emailInput" placeholder="email@example.com">
      <div class="error-msg" id="emailError"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Phone (optional)</label>
      <input type="tel" class="form-input" id="phoneInput" placeholder="+1234567890">
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" id="passwordInput" placeholder="At least 8 characters">
      <div class="error-msg" id="passwordError"></div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="termsCheckbox">
      <label class="checkbox-label">I agree to the terms of service</label>
    </div>

    <button class="submit-btn" onclick="createAccount()">Create account</button>

    <div class="login-link">
      Already have an account? <a href="/auth/login.html">Log in</a>
    </div>
  </div>

  <div class="verification-form" id="verificationForm">
    <div class="form-group">
      <label class="form-label">Verification code</label>
      <p style="margin: 0 0 12px 0; font-size: 12px; color: var(--soft);">
        Enter the 6-digit code sent to <strong id="emailDisplay"></strong>
      </p>
      <input type="text" class="form-input code-input" id="codeInput" placeholder="000000" maxlength="6">
      <div class="error-msg" id="codeError"></div>
    </div>

    <button class="submit-btn" onclick="verifySignup()">Verify & sign up</button>

    <div class="back-link">
      <a href="javascript:backToSignup()">Back</a>
    </div>
  </div>
</div>

<script>
let signupData = {};

function createAccount() {
  const name = document.getElementById('nameInput').value.trim();
  const email = document.getElementById('emailInput').value.trim();
  const phone = document.getElementById('phoneInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const terms = document.getElementById('termsCheckbox').checked;

  let hasError = false;

  if (!name) {
    showError('nameError', 'Name is required');
    hasError = true;
  }

  if (!email) {
    showError('emailError', 'Email is required');
    hasError = true;
  } else if (!isValidEmail(email)) {
    showError('emailError', 'Please enter a valid email');
    hasError = true;
  } else {
    clearError('emailError');
  }

  if (password.length < 8) {
    showError('passwordError', 'Password must be at least 8 characters');
    hasError = true;
  } else {
    clearError('passwordError');
  }

  if (!terms) {
    alert('Please agree to the terms of service');
    hasError = true;
  }

  if (hasError) return;

  signupData = { name, email, phone, password };

  document.getElementById('signupForm').style.display = 'none';
  document.getElementById('verificationForm').classList.add('active');
  document.getElementById('emailDisplay').textContent = email;

  setTimeout(() => {
    document.getElementById('codeInput').focus();
  }, 100);
}

function verifySignup() {
  const code = document.getElementById('codeInput').value;
  const error = document.getElementById('codeError');

  if (code !== '123456') {
    error.textContent = 'Incorrect code. Please try again.';
    error.classList.add('show');
    return;
  }

  error.classList.remove('show');

  const userData = {
    name: signupData.name,
    email: signupData.email,
    phone: signupData.phone,
    createdAt: new Date().toISOString()
  };

  localStorage.setItem('userData', JSON.stringify(userData));
  localStorage.setItem('sessionToken', 'session-' + Date.now());

  alert('Account created successfully! Welcome to Oxford Comma.');
  window.location.href = '../app.html';
}

function backToSignup() {
  document.getElementById('signupForm').style.display = 'block';
  document.getElementById('verificationForm').classList.remove('active');
  document.getElementById('codeInput').value = '';
  clearError('codeError');
}

function isValidEmail(email) {
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return emailRegex.test(email);
}

function showError(elementId, message) {
  const el = document.getElementById(elementId);
  el.textContent = message;
  el.classList.add('show');
}

function clearError(elementId) {
  const el = document.getElementById(elementId);
  el.classList.remove('show');
}

document.getElementById('codeInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') verifySignup();
});
</script>

</body>
</html>
