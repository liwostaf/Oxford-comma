<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Oxford Comma</title>
  <style>
    :root {
      --navy: #1B2540;
      --cream: #FFF6E6;
      --white: #FFFFFF;
      --butter: #FFD66B;
      --matcha: #A8CC8C;
      --soft: #5A6078;
      --ok: #2F6B45;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--navy);
      color: var(--cream);
      font-family: "Bricolage Grotesque", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap');

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-area img {
      width: 60px;
      height: 60px;
      margin-bottom: 16px;
    }

    .logo-area h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      text-transform: lowercase;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--butter);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--cream);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: var(--navy);
      background: var(--cream);
    }

    .form-input::placeholder {
      color: var(--soft);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--butter);
      color: var(--navy);
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      text-transform: lowercase;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .submit-btn:hover {
      transform: scale(1.02);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .divider {
      text-align: center;
      margin: 24px 0;
      color: var(--soft);
      font-size: 12px;
    }

    .signup-link {
      text-align: center;
      padding: 12px;
      background: rgba(255, 246, 230, 0.05);
      border-radius: 8px;
      border: 2px solid rgba(255, 246, 230, 0.1);
    }

    .signup-link a {
      color: var(--butter);
      text-decoration: none;
      font-weight: 700;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .error-msg {
      color: #FF6B35;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .info-msg {
      background: rgba(168, 204, 140, 0.1);
      color: var(--matcha);
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 20px;
      border-left: 4px solid var(--matcha);
    }

    .verification-form {
      display: none;
    }

    .verification-form.active {
      display: block;
    }

    .code-input {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .back-link {
      text-align: center;
      margin-top: 16px;
    }

    .back-link a {
      color: var(--soft);
      text-decoration: none;
      font-size: 12px;
    }

    .back-link a:hover {
      color: var(--cream);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo-area" onclick="window.location.href='../app.html'" style="cursor: pointer;">
    <img src="../logo.svg" alt="Oxford Comma" style="cursor: pointer;">
    <h1 style="cursor: pointer;">Oxford Comma</h1>
  </div>

  <div id="loginForm">
    <div class="info-msg">
      For Phase 1 testing: use any email, then code is always <strong>123456</strong>
    </div>

    <div class="form-group">
      <label class="form-label">Email or phone</label>
      <input type="text" class="form-input" id="contactInput" placeholder="email@example.com or +1234567890">
      <div class="error-msg" id="contactError"></div>
    </div>

    <button class="submit-btn" onclick="sendVerificationCode()">Send code</button>

    <div class="signup-link">
      New to Oxford Comma? <a href="/auth/signup.html">Create an account</a>
    </div>

    <div class="divider">or</div>

    <button class="submit-btn" onclick="guestCheckout()" style="background: var(--soft);">Continue as guest</button>
  </div>

  <div class="verification-form" id="verificationForm">
    <div class="form-group">
      <label class="form-label">Verification code</label>
      <p style="margin: 0 0 12px 0; font-size: 12px; color: var(--soft);">
        Enter the 6-digit code sent to <strong id="contactDisplay"></strong>
      </p>
      <input type="text" class="form-input code-input" id="codeInput" placeholder="000000" maxlength="6">
      <div class="error-msg" id="codeError"></div>
    </div>

    <button class="submit-btn" onclick="verifyCode()">Verify code</button>

    <div class="back-link">
      <a href="javascript:backToLogin()">Back</a>
    </div>
  </div>
</div>

<script>
let currentContact = '';

function sendVerificationCode() {
  const contact = document.getElementById('contactInput').value.trim();
  const error = document.getElementById('contactError');

  if (!contact) {
    error.textContent = 'Please enter an email or phone number';
    error.classList.add('show');
    return;
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const phoneRegex = /^[\d\-\+\(\)\s]{10,}$/;

  if (!emailRegex.test(contact) && !phoneRegex.test(contact)) {
    error.textContent = 'Please enter a valid email or phone number';
    error.classList.add('show');
    return;
  }

  error.classList.remove('show');
  currentContact = contact;

  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('verificationForm').classList.add('active');
  document.getElementById('contactDisplay').textContent = contact;

  setTimeout(() => {
    document.getElementById('codeInput').focus();
  }, 100);
}

function verifyCode() {
  const code = document.getElementById('codeInput').value;
  const error = document.getElementById('codeError');

  if (code !== '123456') {
    error.textContent = 'Incorrect code. Hint: 123456';
    error.classList.add('show');
    return;
  }

  error.classList.remove('show');

  const userData = {
    contact: currentContact,
    signedInAt: new Date().toISOString()
  };

  localStorage.setItem('userData', JSON.stringify(userData));
  localStorage.setItem('sessionToken', 'session-' + Date.now());

  window.location.href = '../app.html';
}

function backToLogin() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('verificationForm').classList.remove('active');
  document.getElementById('contactInput').value = '';
  document.getElementById('codeInput').value = '';
  document.getElementById('contactError').classList.remove('show');
  document.getElementById('codeError').classList.remove('show');
}

function guestCheckout() {
  localStorage.removeItem('userData');
  localStorage.removeItem('sessionToken');
  window.location.href = '../app.html';
}

document.getElementById('codeInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') verifyCode();
});
</script>

</body>
</html>
