<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Oxford Comma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap">
<style>
:root {
  --navy: #1B2540;
  --cream: #FFF6E6;
  --white: #FFFFFF;
  --butter: #FFD66B;
  --matcha: #A8CC8C;
  --soft: #5A6078;
  --ok: #2F6B45;
  --warn: #8A4B0C;
  --display: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  --shadow: 0 4px 12px rgba(27, 37, 64, 0.12);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #0B1020;
    --cream: #131A2E;
    --white: #1C2540;
    --soft: #B4B9CC;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--navy);
  color: var(--cream);
  font-family: var(--display);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
}

/* Loading page */
.loading-page {
  position: fixed;
  inset: 0;
  background: var(--navy);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 32px;
  z-index: 1000;
  opacity: 1;
  transition: opacity 0.3s ease;
}

.loading-page.hidden {
  opacity: 0;
  pointer-events: none;
}

.loading-logo {
  width: 80px;
  height: 100px;
  opacity: 0.9;
}

.loading-text {
  color: var(--cream);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: lowercase;
  opacity: 0.7;
}

/* Container */
.container {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  gap: 20px;
}

/* iPhone simulator */
.iphone-frame {
  position: relative;
  width: 390px;
  height: 844px;
  background: #000;
  border-radius: 60px;
  border: 12px solid #000;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
  overflow: hidden;
  flex-shrink: 0;
}

/* Notch */
.iphone-frame::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 210px;
  height: 30px;
  background: #000;
  border-radius: 0 0 40px 40px;
  z-index: 10;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
}

/* Home indicator */
.iphone-frame::after {
  content: '';
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 140px;
  height: 5px;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 999px;
  z-index: 10;
}

.iphone-screen {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--white);
  color: var(--navy);
  display: flex;
  flex-direction: column;
}

/* App header */
.app-header {
  background: var(--navy);
  color: var(--cream);
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255, 246, 230, 0.1);
  position: sticky;
  top: 0;
  z-index: 50;
}

.app-logo {
  width: 40px;
  height: auto;
  cursor: pointer;
}

.app-title {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  text-transform: lowercase;
  flex: 1;
  text-align: center;
}

.close-btn {
  background: transparent;
  border: none;
  color: var(--cream);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
}

/* App content */
.app-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

/* Loading screen */
.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* Home screen */
.home-screen {
  display: grid;
  gap: 16px;
}

.home-button {
  padding: 20px;
  background: var(--navy);
  color: var(--cream);
  border: 2px solid var(--navy);
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  text-transform: lowercase;
  transition: all 0.2s;
}

.home-button:active {
  transform: scale(0.98);
  box-shadow: inset 0 0 0 2px var(--cream);
}

.home-button.secondary {
  background: var(--cream);
  color: var(--navy);
}

/* Ordering screen */
.order-section {
  display: none;
  gap: 16px;
}

.order-section.active {
  display: grid;
}

.section-title {
  margin: 0 0 12px 0;
  font-size: 14px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--soft);
}

.drinks-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.drink-card {
  padding: 16px;
  background: var(--cream);
  border: 2px solid var(--navy);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.drink-card:active {
  transform: scale(0.98);
}

.drink-card.selected {
  background: var(--matcha);
  border-color: var(--matcha);
}

.drink-name {
  font-weight: 800;
  font-size: 14px;
  margin: 0 0 4px 0;
}

.drink-price {
  font-size: 12px;
  color: var(--soft);
  margin: 0;
}

.drink-card.selected .drink-price {
  color: var(--navy);
}

.size-options {
  display: flex;
  gap: 8px;
}

.size-btn {
  flex: 1;
  padding: 12px 8px;
  background: var(--cream);
  border: 2px solid var(--navy);
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  text-transform: lowercase;
  transition: all 0.2s;
}

.size-btn:active {
  transform: scale(0.98);
}

.size-btn.selected {
  background: var(--butter);
}

.milk-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.milk-btn {
  padding: 12px;
  background: var(--cream);
  border: 2px solid var(--navy);
  border-radius: 8px;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  text-transform: lowercase;
  transition: all 0.2s;
}

.milk-btn:active {
  transform: scale(0.98);
}

.milk-btn.selected {
  background: var(--matcha);
}

.time-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.time-btn {
  padding: 12px;
  background: var(--cream);
  border: 2px solid var(--navy);
  border-radius: 8px;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  text-transform: lowercase;
  transition: all 0.2s;
}

.time-btn:active {
  transform: scale(0.98);
}

.time-btn.selected {
  background: var(--ok);
  color: var(--white);
  border-color: var(--ok);
}

.form-group {
  display: grid;
  gap: 6px;
}

.form-label {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--soft);
}

.form-input {
  padding: 12px;
  border: 2px solid var(--navy);
  border-radius: 8px;
  font-family: var(--display);
  font-size: 14px;
}

.reserve-btn {
  width: 100%;
  padding: 16px;
  background: var(--navy);
  color: var(--cream);
  border: none;
  border-radius: 12px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  text-transform: lowercase;
  margin-top: 8px;
  transition: all 0.2s;
}

.reserve-btn:active {
  transform: scale(0.98);
}

/* Orders list */
.orders-list {
  display: grid;
  gap: 12px;
}

.order-item {
  padding: 16px;
  background: var(--cream);
  border: 2px solid var(--navy);
  border-radius: 12px;
}

.order-number {
  font-weight: 800;
  font-size: 18px;
  color: var(--matcha);
  margin: 0 0 8px 0;
}

.order-details {
  font-size: 13px;
  color: var(--soft);
  margin: 0;
  line-height: 1.6;
}

.order-status {
  display: inline-block;
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.order-status.reserved {
  background: rgba(255, 214, 107, 0.3);
  color: var(--warn);
}

.order-status.ready {
  background: rgba(47, 107, 69, 0.3);
  color: var(--ok);
}

.order-status.picked-up {
  background: rgba(90, 96, 120, 0.2);
  color: var(--soft);
}

/* Store mode */
.store-orders {
  display: grid;
  gap: 16px;
}

.time-slot {
  border-left: 4px solid var(--matcha);
  padding: 12px;
  background: var(--cream);
  border-radius: 8px;
}

.slot-time {
  font-weight: 800;
  font-size: 14px;
  margin: 0 0 8px 0;
}

.slot-count {
  font-size: 12px;
  color: var(--soft);
  margin: 0;
}

.slot-orders {
  margin-top: 12px;
  display: grid;
  gap: 8px;
}

.slot-order {
  padding: 12px;
  background: var(--white);
  border: 1px solid var(--navy);
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.slot-order-info {
  flex: 1;
}

.slot-order-number {
  font-weight: 800;
  font-size: 13px;
  margin: 0;
}

.slot-order-name {
  font-size: 12px;
  color: var(--soft);
  margin: 0;
}

.slot-order-drink {
  font-size: 11px;
  color: var(--soft);
  margin: 2px 0 0 0;
}

.action-btn {
  padding: 6px 12px;
  background: var(--navy);
  color: var(--cream);
  border: none;
  border-radius: 6px;
  font-weight: 700;
  font-size: 11px;
  cursor: pointer;
  text-transform: lowercase;
  white-space: nowrap;
}

.action-btn:active {
  transform: scale(0.98);
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--soft);
}

/* Empty message */
.empty-message {
  text-align: center;
  padding: 20px;
  color: var(--soft);
  font-size: 13px;
}

/* Desktop layout - 2 phones side by side */
@media (min-width: 900px) {
  .container {
    flex-wrap: wrap;
    justify-content: center;
  }

  .iphone-frame {
    margin: 0 10px;
  }
}

/* Mobile layout - single phone, full screen */
@media (max-width: 480px) {
  .container {
    padding: 0;
  }

  .iphone-frame {
    width: 100%;
    height: 100vh;
    border-radius: 0;
    border: none;
  }

  .iphone-screen {
    width: 100%;
    height: 100vh;
  }
}

/* Tablet layout */
@media (max-width: 900px) and (min-width: 481px) {
  .container {
    justify-content: center;
  }

  .iphone-frame {
    width: 85vw;
    max-width: 390px;
  }
}
</style>
</head>
<body>

<div class="loading-page" id="loadingPage">
  <svg class="loading-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="50" height="60">
    <path d="M 15 20 L 15 65 Q 15 75 25 75 L 70 75 Q 80 75 80 65 L 80 20 Z" fill="none" stroke="#FFF6E6" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 80 35 Q 95 35 95 50 Q 95 65 80 65" fill="none" stroke="#FFF6E6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 30 10 Q 32 5 30 0" fill="none" stroke="#FFF6E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 50 8 Q 52 3 50 -2" fill="none" stroke="#FFF6E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M 70 10 Q 72 5 70 0" fill="none" stroke="#FFF6E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </svg>
  <div class="loading-text">Loading Oxford Comma</div>
</div>

<div class="container">
  <!-- Customer phone -->
  <div class="iphone-frame">
    <div class="iphone-screen" id="phone1Screen">
      <div class="app-header">
        <svg class="app-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
          <path d="M 15 20 L 15 65 Q 15 75 25 75 L 70 75 Q 80 75 80 65 L 80 20 Z" fill="none" stroke="#FFF6E6" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 80 35 Q 95 35 95 50 Q 95 65 80 65" fill="none" stroke="#FFF6E6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 30 10 Q 32 5 30 0" fill="none" stroke="#FFF6E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <path d="M 50 8 Q 52 3 50 -2" fill="none" stroke="#FFF6E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <path d="M 70 10 Q 72 5 70 0" fill="none" stroke="#FFF6E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <h1 class="app-title">Oxford Comma</h1>
        <div style="width: 40px;"></div>
      </div>

      <div class="app-content">
        <!-- Home Screen (Customer) -->
        <div id="home-screen-1" class="screen active home-screen">
          <button class="home-button" onclick="showScreen('phone1', 'order')">Order a drink</button>
          <button class="home-button secondary" onclick="showScreen('phone1', 'myorders')">My orders</button>
        </div>

        <!-- Order Screen (Customer) -->
        <div id="order-screen-1" class="screen">
          <div class="order-section active">
            <div class="section-title">Select a drink</div>
            <div class="drinks-grid" id="drinksGrid1"></div>
          </div>

          <div class="order-section">
            <div class="section-title">Size</div>
            <div class="size-options" id="sizeOptions1"></div>
          </div>

          <div class="order-section">
            <div class="section-title">Milk</div>
            <div class="milk-options" id="milkOptions1"></div>
          </div>

          <div class="order-section">
            <div class="section-title">Pickup time</div>
            <div class="time-options" id="timeOptions1"></div>
          </div>

          <div class="order-section">
            <div class="form-group">
              <label class="form-label">Name</label>
              <input type="text" class="form-input" id="name1" placeholder="Your name">
            </div>
            <div class="form-group">
              <label class="form-label">Contact</label>
              <input type="text" class="form-input" id="contact1" placeholder="Phone or email">
            </div>
            <button class="reserve-btn" onclick="placeOrder('phone1')">Reserve order</button>
            <button class="reserve-btn" style="background: var(--soft);" onclick="showScreen('phone1', 'home')">Back</button>
          </div>
        </div>

        <!-- My Orders Screen (Customer) -->
        <div id="myorders-screen-1" class="screen">
          <div class="section-title" style="margin-top: 0;">Your orders</div>
          <div id="myOrdersList1"></div>
          <button class="reserve-btn" style="background: var(--soft);" onclick="showScreen('phone1', 'home')">Back</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Staff phone -->
  <div class="iphone-frame">
    <div class="iphone-screen" id="phone2Screen">
      <div class="app-header">
        <svg class="app-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
          <path d="M 15 20 L 15 65 Q 15 75 25 75 L 70 75 Q 80 75 80 65 L 80 20 Z" fill="none" stroke="#FFF6E6" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 80 35 Q 95 35 95 50 Q 95 65 80 65" fill="none" stroke="#FFF6E6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 30 10 Q 32 5 30 0" fill="none" stroke="#FFF6E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <path d="M 50 8 Q 52 3 50 -2" fill="none" stroke="#FFF6E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <path d="M 70 10 Q 72 5 70 0" fill="none" stroke="#FFF6E6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <h1 class="app-title">Oxford Comma</h1>
        <div style="width: 40px;"></div>
      </div>

      <div class="app-content">
        <!-- Home Screen (Staff) -->
        <div id="home-screen-2" class="screen active home-screen">
          <button class="home-button" onclick="showScreen('phone2', 'order')">Order for yourself</button>
          <button class="home-button secondary" onclick="showScreen('phone2', 'store')">Pickup board</button>
        </div>

        <!-- Order Screen (Staff) -->
        <div id="order-screen-2" class="screen">
          <div class="order-section active">
            <div class="section-title">Select a drink</div>
            <div class="drinks-grid" id="drinksGrid2"></div>
          </div>

          <div class="order-section">
            <div class="section-title">Size</div>
            <div class="size-options" id="sizeOptions2"></div>
          </div>

          <div class="order-section">
            <div class="section-title">Milk</div>
            <div class="milk-options" id="milkOptions2"></div>
          </div>

          <div class="order-section">
            <div class="section-title">Pickup time</div>
            <div class="time-options" id="timeOptions2"></div>
          </div>

          <div class="order-section">
            <div class="form-group">
              <label class="form-label">Name</label>
              <input type="text" class="form-input" id="name2" placeholder="Your name">
            </div>
            <div class="form-group">
              <label class="form-label">Contact</label>
              <input type="text" class="form-input" id="contact2" placeholder="Phone or email">
            </div>
            <button class="reserve-btn" onclick="placeOrder('phone2')">Reserve order</button>
            <button class="reserve-btn" style="background: var(--soft);" onclick="showScreen('phone2', 'home')">Back</button>
          </div>
        </div>

        <!-- Store Mode (Pickup Board) -->
        <div id="store-screen-2" class="screen">
          <div class="section-title" style="margin-top: 0;">Orders by time</div>
          <div id="storeOrdersList2"></div>
          <button class="reserve-btn" style="background: var(--soft);" onclick="showScreen('phone2', 'home')">Back</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const POPUP_DATE = '2026-10-05';
const MENU = [
  { id: 'latte', name: 'Latte', price: 4.50 },
  { id: 'cappuccino', name: 'Cappuccino', price: 4.75 },
  { id: 'flatwhite', name: 'Flat White', price: 5.00 },
  { id: 'honeylav', name: 'Honey Lavender', price: 4.50 },
  { id: 'matcha', name: 'Matcha', price: 4.00 },
  { id: 'nitro', name: 'Nitro Cold Brew', price: 4.50 }
];
const SIZES = ['12oz', '16oz'];
const MILKS = ['Whole', '2%', 'Skim', 'Oat', 'Almond', 'No Milk'];
const TIMES = ['12:30pm', '12:45pm', '1:00pm', '1:15pm', '1:30pm', '1:45pm', '2:00pm'];

const state = {
  phone1: { drink: null, size: null, milk: null, time: null },
  phone2: { drink: null, size: null, milk: null, time: null }
};

function getOrders() {
  return JSON.parse(localStorage.getItem('orders') || '[]');
}

function saveOrders(orders) {
  localStorage.setItem('orders', JSON.stringify(orders));
}

function hideLoading() {
  document.getElementById('loadingPage').classList.add('hidden');
}

function showScreen(phone, screenName) {
  const screens = document.querySelectorAll(`#${phone}Screen .screen`);
  screens.forEach(s => s.classList.remove('active'));
  document.getElementById(`${screenName}-screen-${phone.replace('phone', '')}`).classList.add('active');

  if (screenName === 'myorders') {
    renderMyOrders(phone);
  } else if (screenName === 'store') {
    renderStoreOrders(phone);
  }
}

function initDrinks(phone) {
  const grid = document.getElementById(`drinksGrid${phone.replace('phone', '')}`);
  grid.innerHTML = MENU.map(drink => `
    <button class="drink-card ${state[phone].drink === drink.id ? 'selected' : ''}"
            onclick="selectDrink('${phone}', '${drink.id}')">
      <p class="drink-name">${drink.name}</p>
      <p class="drink-price">$${drink.price.toFixed(2)}</p>
    </button>
  `).join('');
}

function selectDrink(phone, drinkId) {
  state[phone].drink = drinkId;
  initDrinks(phone);
}

function initSizes(phone) {
  const container = document.getElementById(`sizeOptions${phone.replace('phone', '')}`);
  container.innerHTML = SIZES.map(size => `
    <button class="size-btn ${state[phone].size === size ? 'selected' : ''}"
            onclick="selectSize('${phone}', '${size}')">${size}</button>
  `).join('');
}

function selectSize(phone, size) {
  state[phone].size = size;
  initSizes(phone);
}

function initMilks(phone) {
  const container = document.getElementById(`milkOptions${phone.replace('phone', '')}`);
  container.innerHTML = MILKS.map(milk => `
    <button class="milk-btn ${state[phone].milk === milk ? 'selected' : ''}"
            onclick="selectMilk('${phone}', '${milk}')">${milk}</button>
  `).join('');
}

function selectMilk(phone, milk) {
  state[phone].milk = milk;
  initMilks(phone);
}

function initTimes(phone) {
  const container = document.getElementById(`timeOptions${phone.replace('phone', '')}`);
  container.innerHTML = TIMES.map(time => `
    <button class="time-btn ${state[phone].time === time ? 'selected' : ''}"
            onclick="selectTime('${phone}', '${time}')">${time}</button>
  `).join('');
}

function selectTime(phone, time) {
  state[phone].time = time;
  initTimes(phone);
}

function placeOrder(phone) {
  const phoneNum = phone.replace('phone', '');
  const name = document.getElementById(`name${phoneNum}`).value.trim();
  const contact = document.getElementById(`contact${phoneNum}`).value.trim();

  if (!state[phone].drink || !state[phone].size || !state[phone].milk || !state[phone].time || !name || !contact) {
    alert('Please fill in all fields');
    return;
  }

  const orders = getOrders();
  const drinkInfo = MENU.find(d => d.id === state[phone].drink);
  const order = {
    id: 'order-' + Date.now() + Math.random(),
    number: String(orders.length + 1).padStart(3, '0'),
    drink: drinkInfo.name,
    price: drinkInfo.price,
    size: state[phone].size,
    milk: state[phone].milk,
    time: state[phone].time,
    name: name,
    contact: contact,
    status: 'reserved',
    date: POPUP_DATE,
    created: new Date().toISOString()
  };

  orders.push(order);
  saveOrders(orders);

  state[phone] = { drink: null, size: null, milk: null, time: null };
  document.getElementById(`name${phoneNum}`).value = '';
  document.getElementById(`contact${phoneNum}`).value = '';

  alert(`Order #${order.number} reserved for ${order.time}`);
  showScreen(phone, 'home');
}

function renderMyOrders(phone) {
  const phoneNum = phone.replace('phone', '');
  const container = document.getElementById(`myOrdersList${phoneNum}`);
  const orders = getOrders();

  if (orders.length === 0) {
    container.innerHTML = '<div class="empty-message">No orders yet</div>';
    return;
  }

  container.innerHTML = `<div class="orders-list">${orders.map(o => `
    <div class="order-item">
      <p class="order-number">#${o.number}</p>
      <p class="order-details">
        ${o.size} ${o.drink} with ${o.milk}<br>
        Pickup: ${o.time}<br>
        Name: ${o.name}
      </p>
      <span class="order-status ${o.status}">${o.status.replace('_', ' ')}</span>
    </div>
  `).join('')}</div>`;
}

function renderStoreOrders(phone) {
  const phoneNum = phone.replace('phone', '');
  const container = document.getElementById(`storeOrdersList${phoneNum}`);
  const orders = getOrders().filter(o => o.date === POPUP_DATE);

  if (orders.length === 0) {
    container.innerHTML = '<div class="empty-message">No orders</div>';
    return;
  }

  const byTime = {};
  orders.forEach(o => {
    if (!byTime[o.time]) byTime[o.time] = [];
    byTime[o.time].push(o);
  });

  const sortedTimes = TIMES.filter(t => byTime[t]);

  container.innerHTML = `<div class="store-orders">${sortedTimes.map(time => `
    <div class="time-slot">
      <p class="slot-time">${time}</p>
      <p class="slot-count">${byTime[time].length} order${byTime[time].length !== 1 ? 's' : ''}</p>
      <div class="slot-orders">${byTime[time].map(o => `
        <div class="slot-order">
          <div class="slot-order-info">
            <p class="slot-order-number">#${o.number} - ${o.name}</p>
            <p class="slot-order-drink">${o.size} ${o.drink} · ${o.milk}</p>
          </div>
          <button class="action-btn" onclick="updateStatus('${o.id}', '${o.status === 'reserved' ? 'ready' : 'picked_up'}')">${o.status === 'reserved' ? 'Ready' : 'Picked Up'}</button>
        </div>
      `).join('')}</div>
    </div>
  `).join('')}</div>`;
}

function updateStatus(orderId, newStatus) {
  const orders = getOrders();
  const order = orders.find(o => o.id === orderId);
  if (order) {
    order.status = newStatus;
    saveOrders(orders);
    renderStoreOrders('phone2');
  }
}

function init() {
  [TIMES, SIZES, MILKS].forEach(() => {});

  initDrinks('phone1');
  initSizes('phone1');
  initMilks('phone1');
  initTimes('phone1');

  initDrinks('phone2');
  initSizes('phone2');
  initMilks('phone2');
  initTimes('phone2');

  setTimeout(hideLoading, 500);
}

window.addEventListener('DOMContentLoaded', init);
</script>
