<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Board - The Oxford Comma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap">
<style>
:root {
  --navy: #1B2540;
  --cream: #FFF6E6;
  --white: #FFFFFF;
  --butter: #FFD66B;
  --matcha: #A8CC8C;
  --soft: #5A6078;
  --ok: #2F6B45;
  --warn: #8A4B0C;
  --display: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #0B1020;
    --cream: #131A2E;
    --white: #1C2540;
    --soft: #B4B9CC;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--navy);
  color: var(--cream);
  font-family: var(--display);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
}

header {
  background: var(--navy);
  padding: 16px;
  border-bottom: 2px solid var(--cream);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo-img {
  width: 50px;
  height: auto;
}

.header-title {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  text-transform: lowercase;
}

.refresh-btn {
  background: var(--butter);
  color: var(--navy);
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  text-transform: uppercase;
}

.refresh-btn:hover {
  transform: scale(1.05);
}

main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 16px;
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.stat {
  padding: 16px;
  border: 2px solid var(--cream);
  border-radius: 12px;
  background: var(--white);
  color: var(--navy);
  text-align: center;
}

.stat:nth-child(1) { background: var(--butter); }
.stat:nth-child(2) { background: var(--matcha); }
.stat:nth-child(3) { background: var(--cream); }
.stat:nth-child(4) { background: var(--cream); }

.stat .value {
  font-weight: 800;
  font-size: 28px;
  margin-bottom: 4px;
}

.stat .label {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.75;
}

/* Orders by slot */
.slot-section {
  margin-bottom: 32px;
}

.slot-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 0 0 8px 0;
  border-bottom: 2px solid var(--cream);
}

.slot-header h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
}

.slot-header .count {
  font-size: 12px;
  color: var(--soft);
}

/* Order card */
.order-card {
  background: var(--white);
  color: var(--navy);
  border: 2px solid var(--navy);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
}

.order-card.picked-up {
  opacity: 0.6;
  background: var(--cream);
}

.order-code {
  background: var(--matcha);
  color: var(--navy);
  padding: 8px 12px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  white-space: nowrap;
}

.order-details {
  display: grid;
  gap: 4px;
}

.order-name {
  font-weight: 800;
  font-size: 16px;
}

.order-drink {
  font-size: 14px;
  color: var(--soft);
}

.order-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.status-pill {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.status-pill.reserved {
  background: rgba(255, 214, 107, 0.3);
  color: var(--warn);
  border: 1px solid var(--warn);
}

.status-pill.ready {
  background: rgba(47, 107, 69, 0.3);
  color: var(--ok);
  border: 1px solid var(--ok);
}

.status-pill.picked-up {
  background: rgba(90, 96, 120, 0.2);
  color: var(--soft);
  border: 1px solid var(--soft);
}

.action-btn {
  background: var(--navy);
  color: var(--cream);
  border: 1px solid var(--cream);
  border-radius: 6px;
  padding: 6px 12px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}

.action-btn:hover {
  background: var(--butter);
  color: var(--navy);
  border-color: var(--butter);
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--soft);
}

/* Sound toggle */
.controls {
  margin-bottom: 24px;
  padding: 16px;
  background: var(--white);
  color: var(--navy);
  border-radius: 12px;
  display: flex;
  gap: 16px;
  align-items: center;
}

.controls label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  cursor: pointer;
}

.controls input[type="checkbox"] {
  cursor: pointer;
}

@media (max-width: 768px) {
  .order-card {
    grid-template-columns: 1fr;
  }

  .order-actions {
    flex-wrap: wrap;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>
<body>

<header>
  <img src="/logo.webp" alt="The Oxford Comma" class="logo-img">
  <h1 class="header-title">Pickup Board</h1>
  <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
</header>

<main>
  <div class="controls">
    <label>
      <input type="checkbox" id="soundToggle" checked>
      🔔 Enable sound alerts
    </label>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="value" id="statReserved">0</div>
      <div class="label">Reserved</div>
    </div>
    <div class="stat">
      <div class="value" id="statReady">0</div>
      <div class="label">Ready</div>
    </div>
    <div class="stat">
      <div class="value" id="statPickedUp">0</div>
      <div class="label">Picked up</div>
    </div>
    <div class="stat">
      <div class="value" id="statRevenue">$0</div>
      <div class="label">Revenue</div>
    </div>
  </div>

  <!-- Orders by slot -->
  <div id="boardContainer"></div>
</main>

<script>
// ========== CONFIG ==========
const POPUP_DATE = '2026-10-05';
const POPUP_LOCATION = 'Blue booths';

function fmtTime(hm) {
  let [h, m] = hm.split(':').map(Number);
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return h + ':' + String(m).padStart(2, '0') + ap;
}

// ========== SOUNDS ==========
function playSound(type) {
  if (!document.getElementById('soundToggle').checked) return;

  const audioContext = new (window.AudioContext || window.webkitAudioContext)();

  if (type === 'new') {
    // Ding sound for new order
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

    osc.start(audioContext.currentTime);
    osc.stop(audioContext.currentTime + 0.5);
  } else if (type === 'ready') {
    // Double ding for ready
    for (let i = 0; i < 2; i++) {
      setTimeout(() => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.value = 600;
        gain.gain.setValueAtTime(0.2, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
        osc.start(audioContext.currentTime);
        osc.stop(audioContext.currentTime + 0.3);
      }, i * 300);
    }
  } else if (type === 'cancel') {
    // Warning sound for cancellation
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.frequency.value = 400;
    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.6);
    osc.start(audioContext.currentTime);
    osc.stop(audioContext.currentTime + 0.6);
  }
}

// ========== RENDER ==========
let lastOrders = [];

function render() {
  const orders = JSON.parse(localStorage.getItem('oxford-comma-orders') || '[]');
  const filtered = orders.filter(o => o.popupDate === POPUP_DATE && o.status !== 'cancelled');

  // Detect new orders
  const newOrderIds = filtered.filter(o => !lastOrders.find(lo => lo.id === o.id)).map(o => o.id);
  newOrderIds.forEach(() => playSound('new'));
  lastOrders = filtered;

  // Update stats
  const reserved = filtered.filter(o => o.status === 'reserved').length;
  const ready = filtered.filter(o => o.status === 'ready').length;
  const pickedUp = filtered.filter(o => o.status === 'picked_up').length;
  const revenue = filtered.reduce((sum, o) => sum + (o.totalPrice || 0), 0);

  document.getElementById('statReserved').textContent = reserved;
  document.getElementById('statReady').textContent = ready;
  document.getElementById('statPickedUp').textContent = pickedUp;
  document.getElementById('statRevenue').textContent = '$' + revenue.toFixed(2);

  // Group by slot
  const bySlot = {};
  filtered.forEach(o => {
    if (!bySlot[o.pickupTime]) bySlot[o.pickupTime] = [];
    bySlot[o.pickupTime].push(o);
  });

  // Sort by time
  const slots = Object.keys(bySlot).sort();

  if (slots.length === 0) {
    document.getElementById('boardContainer').innerHTML = `<div class="empty-state">No orders yet.</div>`;
    return;
  }

  document.getElementById('boardContainer').innerHTML = slots.map(slot => {
    const slotOrders = bySlot[slot].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

    return `
      <div class="slot-section">
        <div class="slot-header">
          <h3>${fmtTime(slot)}</h3>
          <span class="count">${slotOrders.length} order${slotOrders.length !== 1 ? 's' : ''}</span>
        </div>
        ${slotOrders.map(o => `
          <div class="order-card ${o.status === 'picked_up' ? 'picked-up' : ''}">
            <div class="order-code">#${o.orderNumber}</div>
            <div class="order-details">
              <div class="order-name">${o.guestName}</div>
              <div class="order-drink">${o.size} ${o.drink} · ${o.milk}</div>
            </div>
            <div class="order-actions">
              <span class="status-pill ${o.status}">${o.status.replace('_', ' ')}</span>
              ${o.status === 'reserved' ? `
                <button class="action-btn" onclick="updateOrderStatus('${o.id}', 'ready', event)">mark ready</button>
              ` : o.status === 'ready' ? `
                <button class="action-btn" onclick="updateOrderStatus('${o.id}', 'picked_up', event)">picked up</button>
              ` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
}

// ========== ACTIONS ==========
window.updateOrderStatus = (orderId, newStatus, event) => {
  event.preventDefault();

  const orders = JSON.parse(localStorage.getItem('oxford-comma-orders') || '[]');
  const order = orders.find(o => o.id === orderId);

  if (!order) return;

  order.status = newStatus;
  localStorage.setItem('oxford-comma-orders', JSON.stringify(orders));

  if (newStatus === 'ready') {
    playSound('ready');
  }

  render();
};

// ========== POLLING ==========
document.getElementById('refreshBtn').addEventListener('click', render);
document.getElementById('soundToggle').addEventListener('change', render);

// Listen for updates from customer app
window.addEventListener('newOrder', render);

// Poll every 2 seconds
setInterval(render, 2000);

// Initial render
window.addEventListener('DOMContentLoaded', render);
</script>

</body>
</html>
